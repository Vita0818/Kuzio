name: Kuzio

options:
  bundleIdPrefix: com.Vita0818
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  Intatis:
    path: ../../Intatis

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic

targets:
  Kuzio:
    type: application
    platform: macOS
    sources:
      - path: Sources/KuzioApp
        excludes:
          - Fonts
      - path: Sources/KuzioApp/Fonts/JetBrainsMono-OFL.txt
        buildPhase: resources
      - path: ../../Intatis/.intatis/runtime-kit/0.66/CodexRuntime
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.Kuzio
        PRODUCT_MODULE_NAME: KuzioApp
        DEVELOPMENT_TEAM: L5ZXXFUZTL
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Kuzio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    dependencies:
      - package: Intatis
        product: IntatisCore
      - package: Intatis
        product: IntatisProtocol
      - package: Intatis
        product: IntatisProviders
      - package: Intatis
        product: IntatisConversation
      - package: Intatis
        product: IntatisCodexRuntime
      - package: Intatis
        product: IntatisCoworkUI
      - package: Intatis
        product: IntatisSharedUI

schemes:
  Kuzio:
    build:
      targets:
        Kuzio: all
    run:
      config: Debug
    management:
      shared: true
      orderHint: 0
      isShown: true
